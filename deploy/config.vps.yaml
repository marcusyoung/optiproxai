            provider: "doubleword"
            max_input_tokens: 1048576
          - model: "thinkingmachines/Inkling-NVFP4" # vision, 1M
            provider: "doubleword"
            max_input_tokens: 1000000
          - model: "moonshotai/kimi-k3" # vision, retained extra fallback
            provider: "doubleword"
            max_input_tokens: 1048576

  # Async (non-realtime) variant of the code profile for background workloads
  # (e.g. opencode-autolearn). Target via model "optiproxai/async".
  # Each entry opts into the provider async mechanism (service_tier: flex);
  # entry-level enabled overrides rule-level enabled: false (e.g. GLM-5.3).
  # Pricing reflects Doubleword async rates (display-only, dashboard estimates).
  # TASK-26: REASONING models are intentionally left unchanged in this profile;
  # only the tier-level effort ladder was re-spread.
  async:
    tiers:
      SIMPLE:
        reasoning_effort: "low"
        primary:
