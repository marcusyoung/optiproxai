# OptiProxAI Apache vhost (Ubuntu 24.04, certbot --apache + int2.uk hostname).
#
# Install to /etc/apache2/sites-available/optiproxai.conf, then:
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite optiproxai
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d optiproxai.int2.uk
#
# certbot copies these directives into optiproxai-le-ssl.conf; verify the 443
# block still contains ProxyPass/ProxyPassReverse afterwards.
#
# AUTH MODEL
# ----------
# OptiProxAI handles auth itself; Apache does NOT need htpasswd or header
# injection. Programmatic clients use `Authorization: Bearer <key>`. Browsers
# hitting /dashboard use the SAME key via HTTP Basic (username is ignored,
# password = the OptiProxAI API key) — the proxy returns a WWW-Authenticate
# challenge so the browser prompts automatically.
#
# The only edge rules needed are the deny block for endpoints that have no
# browser use case and should not be publicly reachable.

<VirtualHost *:80>
    ServerName optiproxai.int2.uk

    ProxyPreserveHost On
    ProxyTimeout 600

    # nocanon preserves encoded paths; flushpackets=on keeps SSE streaming
    # unbuffered. Cursor appends /chat/completions, so root-mapping is correct.
    ProxyPass        / http://127.0.0.1:18421/ nocanon flushpackets=on
    ProxyPassReverse / http://127.0.0.1:18421/

    # Admin API and OpenAPI schema: keep off the public edge entirely.
    <LocationMatch "^/(admin|openapi\.json)">
        Require all denied
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/optiproxai-error.log
    CustomLog ${APACHE_LOG_DIR}/optiproxai-access.log combined
</VirtualHost>
